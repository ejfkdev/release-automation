name: publish

on:
  workflow_dispatch:
    inputs:
      programs:
        description: "Comma-separated program names, or all"
        required: false
        default: "all"
      channels:
        description: "Comma-separated channels: npm,winget"
        required: false
        default: "npm,winget"
      dry_run:
        description: "Print commands without publishing"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.plan.outputs.npm }}
      winget: ${{ steps.plan.outputs.winget }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/sync.py --refresh

      - name: Verify generated output
        run: python3 tool/sync.py --check

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no catalog changes"
            exit 0
          fi
          git commit -m "catalog: publish $(date -u +%F)"
          git push

      - name: Build publish plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "${{ inputs.programs }}" != "all" ]; then
            IFS=',' read -ra names <<< "${{ inputs.programs }}"
            for name in "${names[@]}"; do
              name="$(echo "$name" | xargs)"
              if [ -n "$name" ]; then
                args+=(--program "$name")
              fi
            done
          fi
          python3 tool/status.py --plan --json "${args[@]}" > plan.json
          python3 -c 'import json; p=json.load(open("plan.json")); print("npm="+json.dumps(p["npm"],separators=(",",":"))); print("winget="+json.dumps(p["winget"],separators=(",",":")))' >> "$GITHUB_OUTPUT"

  npm:
    needs: plan
    if: ${{ needs.plan.outputs.npm != '[]' && contains(inputs.channels, 'npm') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.npm) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            extra+=(--yes)
          fi
          python3 tool/publish.py npm \
            --program ${{ matrix.program }} \
            --version ${{ matrix.version }} \
            "${extra[@]}"

  winget:
    needs: plan
    if: ${{ needs.plan.outputs.winget != '[]' && contains(inputs.channels, 'winget') }}
    permissions:
      contents: read
    runs-on: windows-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.plan.outputs.winget) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "6.0.x"

      - name: Fetch wingetcreate
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "wingetcreate"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile (Join-Path $dir "wingetcreate.exe")
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify wingetcreate
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\wingetcreate\wingetcreate.exe" -? | Select-Object -First 3

      - name: Submit to WinGet
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          WINGETCREATE: ${{ runner.temp }}\wingetcreate\wingetcreate.exe
        run: |
          $extra = @()
          if ("${{ inputs.dry_run }}" -eq "false") { $extra += "--yes" }
          python tool/publish.py winget --program ${{ matrix.program }} --version ${{ matrix.version }} @extra