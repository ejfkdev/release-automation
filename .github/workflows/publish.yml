name: publish

on:
  workflow_run:
    workflows: [reconcile]
    types: [completed]
  workflow_dispatch:
    inputs:
      programs:
        description: "Comma-separated program names, or all"
        required: false
        default: "all"
      channels:
        description: "Comma-separated channels: npm,winget"
        required: false
        default: "npm,winget"
      dry_run:
        description: "Print commands without publishing"
        type: boolean
        default: true
      validate_trust:
        description: "Publish -trust.1 pre-releases via OIDC to validate trusted publishers"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.plan.outputs.npm }}
      winget: ${{ steps.plan.outputs.winget }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh release metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tool/sync.py --refresh

      - name: Verify generated output
        run: python3 tool/sync.py --check

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no catalog changes"
            exit 0
          fi
          git commit -m "catalog: publish $(date -u +%F)"
          git push

      - name: Build publish plan
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          programs="${{ inputs.programs || 'all' }}"
          if [ "$programs" != "all" ]; then
            IFS=',' read -ra names <<< "$programs"
            for name in "${names[@]}"; do
              name="$(echo "$name" | xargs)"
              if [ -n "$name" ]; then
                args+=(--program "$name")
              fi
            done
          fi
          python3 tool/status.py --plan --json "${args[@]}" > plan.json
          python3 -c 'import json; p=json.load(open("plan.json")); print("npm="+json.dumps(p["npm"],separators=(",",":"))); print("winget="+json.dumps(p["winget"],separators=(",",":")))' >> "$GITHUB_OUTPUT"

  npm:
    needs: plan
    if: ${{ needs.plan.outputs.npm != '[]' && contains(inputs.channels || 'npm,winget', 'npm') }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJson(needs.plan.outputs.npm) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Publish to npm
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          extra=()
          if [ "$DRY_RUN" = "false" ]; then
            extra+=(--yes)
          fi
          python3 tool/publish.py npm \
            --program ${{ matrix.program }} \
            --version ${{ matrix.version }} \
            "${extra[@]}"

  winget:
    needs: plan
    if: ${{ needs.plan.outputs.winget != '[]' && contains(inputs.channels || 'npm,winget', 'winget') }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.plan.outputs.winget) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Submit to WinGet
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -euo pipefail
          extra=()
          if [ "$DRY_RUN" = "false" ]; then
            extra+=(--yes)
          fi
          python3 tool/publish.py winget \
            --program ${{ matrix.program }} \
            --version ${{ matrix.version }} \
            "${extra[@]}"

  trust-validation:
    needs: plan
    if: ${{ inputs.validate_trust == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Show npm version
        run: npm --version

      - name: Validate trusted publishers
        run: python3 tool/publish.py npm --all --trust-validation --yes
